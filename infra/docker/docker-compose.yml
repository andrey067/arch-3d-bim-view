# Arch3DAR — Docker Compose (local dev)
#
# Stack: SQLite + FastAPI BackgroundTasks + trimesh/IfcConvert
#
# Usage:
#   docker compose up -d          # start all services
#   docker compose logs -f        # follow logs
#   docker compose down -v        # stop and remove volumes
#
# Services: backend, frontend

services:
  backend:
    build:
      context: ../..
      dockerfile: app/backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/storage
    environment:
      APP_ENV: dev
      LOG_LEVEL: INFO
      DATABASE_URL: sqlite:////app/storage/app.db
      STORAGE_ROOT: /app/storage
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      PUBLIC_BASE_URL: http://localhost:8000
      IFCCONVERT_PATH: /usr/local/bin/IfcConvert
      USD_FROM_GLTF_PATH: usd_from_gltf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../..
      dockerfile: app/frontend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
