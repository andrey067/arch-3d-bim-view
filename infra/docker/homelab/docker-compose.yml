# Arch3DAR — Homelab Production (HTTPS via Traefik)
#
# Stack: SQLite + FastAPI BackgroundTasks + trimesh/IfcConvert
# No PostgreSQL, Redis, Celery worker, or auth.
#
# Prerequisites:
#   1. Run ./generate-certs.sh to create self-signed TLS certificates
#
# Usage:
#   docker --context homelab compose up -d --build
#   docker --context homelab compose logs -f
#   docker --context homelab compose down
#
# Access: https://192.168.68.51

x-common-build: &common-build
  context: /Volumes/Arquivos/Projetos em andamento/Arch3DAR

services:
  # ── Reverse Proxy ──────────────────────────────────────────────
  traefik:
    build:
      context: /Volumes/Arquivos/Projetos em andamento/Arch3DAR/infra/docker/homelab
      dockerfile: traefik.Dockerfile
    container_name: arch3d-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--providers.file.filename=/dynamic/tls.yaml"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=arch3d_proxy"
      - "--api.dashboard=false"
      - "--api.insecure=false"
      - "--log.level=WARN"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ── API Server + Background Tasks ─────────────────────────────
  backend:
    build:
      context: /Volumes/Arquivos/Projetos em andamento/Arch3DAR/app/backend
      dockerfile: Dockerfile
    container_name: arch3d-backend
    restart: unless-stopped
    networks:
      - internal
      - proxy
    volumes:
      - storage_data:/app/storage
    environment:
      APP_ENV: prod
      LOG_LEVEL: INFO
      DATABASE_URL: sqlite:////app/storage/app.db
      STORAGE_ROOT: /app/storage
      CORS_ORIGINS: https://192.168.68.51
      PUBLIC_BASE_URL: https://192.168.68.51
      IFCCONVERT_PATH: /usr/local/bin/IfcConvert
      USD_FROM_GLTF_PATH: usd_from_gltf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      # Backend API routes
      - "traefik.http.routers.backend.rule=Host(`192.168.68.51`) && (PathPrefix(`/api`) || PathPrefix(`/static`))"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  # ── Frontend (SPA + API proxy) ────────────────────────────────
  frontend:
    build:
      context: /Volumes/Arquivos/Projetos em andamento/Arch3DAR/app/frontend
      dockerfile: Dockerfile
    container_name: arch3d-frontend
    restart: unless-stopped
    networks:
      - proxy
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`192.168.68.51`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=8080"

# ── Networks ─────────────────────────────────────────────────────
networks:
  proxy:
    name: arch3d_proxy
  internal:
    name: arch3d_internal
    internal: true

# ── Volumes ──────────────────────────────────────────────────────
volumes:
  storage_data:
