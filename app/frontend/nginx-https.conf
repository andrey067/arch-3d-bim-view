server {
    listen 3000;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/192.168.68.51.pem;
    ssl_certificate_key /etc/nginx/certs/192.168.68.51-key.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /share/ {
        proxy_pass http://backend:5000/share/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
   }

    # Proxy MinIO buckets through HTTPS (avoid mixed content for model-viewer)
    location /glb-files/ {
        proxy_pass http://minio:9000/glb-files/;
        proxy_set_header Host minio:9000;
    }
    location /thumbnails/ {
        proxy_pass http://minio:9000/thumbnails/;
        proxy_set_header Host minio:9000;
    }
    location /ifc-files/ {
        proxy_pass http://minio:9000/ifc-files/;
        proxy_set_header Host minio:9000;
    }
    location /qrcodes/ {
        proxy_pass http://minio:9000/qrcodes/;
        proxy_set_header Host minio:9000;
    }

    location /node_modules/ { deny all; }
    location /src/ { deny all; }
    location /package.json { deny all; }
    location /vite.config.ts { deny all; }
}
