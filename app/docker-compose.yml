services:
  postgres:
    image: postgres:16-alpine
    container_name: arch3dar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arch3dar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arch3dar_secret}
      POSTGRES_DB: ${POSTGRES_DB:-arch3dar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arch3dar} -d ${POSTGRES_DB:-arch3dar}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    container_name: arch3dar-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  converter:
    build:
      context: ./converter
      dockerfile: Dockerfile
    container_name: arch3dar-converter
    restart: unless-stopped
    environment:
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_GLB: ${MINIO_BUCKET_GLB:-glb-files}
      MINIO_BUCKET_THUMBNAILS: ${MINIO_BUCKET_THUMBNAILS:-thumbnails}
    ports:
      - "8080:8080"
    depends_on:
      minio:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arch3dar-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-arch3dar};Username=${POSTGRES_USER:-arch3dar};Password=${POSTGRES_PASSWORD:-arch3dar_secret}"
      MinIO__Endpoint: "minio:9000"
      MinIO__PublicEndpoint: "${MINIO_PUBLIC_ENDPOINT:-192.168.68.51:9000}"
      MinIO__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MinIO__UseSSL: "false"
      MinIO__BucketIfc: ${MINIO_BUCKET_IFC:-ifc-files}
      MinIO__BucketGlb: ${MINIO_BUCKET_GLB:-glb-files}
      MinIO__BucketThumbnails: ${MINIO_BUCKET_THUMBNAILS:-thumbnails}
      MinIO__PresignTtlSeconds: "${MINIO_PRESIGN_TTL_SECONDS:-3600}"
      PublicBaseUrl: "${PUBLIC_BASE_URL:-http://192.168.68.51:3100}"
      MaxIfcMb: "${MAX_IFC_MB:-100}"
      ConversionTimeoutS: "${CONVERSION_TIMEOUT_S:-120}"
      Converter__Url: "${CONVERTER_URL:-http://converter:8080}"
      Cors__AllowedOrigins: "${CORS_ALLOWED_ORIGINS:-http://192.168.68.51:3100}"
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      converter:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-https://192.168.68.51}"
    container_name: arch3dar-frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: arch3dar-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
    name: arch3dar_postgres_data
  minio_data:
    name: arch3dar_minio_data
