services:
  postgres:
    image: postgres:16-alpine
    container_name: arch3dar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arch3dar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arch3dar_secret}
      POSTGRES_DB: ${POSTGRES_DB:-arch3dar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arch3dar} -d ${POSTGRES_DB:-arch3dar}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  converter:
    build:
      context: ./converter
      dockerfile: Dockerfile
    container_name: arch3dar-converter
    restart: unless-stopped
    environment:
      DATA_ROOT: /data
      IFCCONVERT_PATH: /usr/local/bin/IfcConvert
      USD_FROM_GLTF_PATH: /usr/local/bin/usd_from_gltf
      CONVERSION_TIMEOUT_S: "${CONVERSION_TIMEOUT_S:-120}"
      AR_MAX_EXTENT_M: "${AR_MAX_EXTENT_M:-0.5}"
    ports:
      - "8080:8080"
    volumes:
      - project_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arch3dar-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-arch3dar};Username=${POSTGRES_USER:-arch3dar};Password=${POSTGRES_PASSWORD:-arch3dar_secret}"
      DATA_ROOT: /data
      PublicBaseUrl: "${PUBLIC_BASE_URL:-https://localhost}"
      MaxIfcMb: "${MAX_IFC_MB:-100}"
      ConversionTimeoutS: "${CONVERSION_TIMEOUT_S:-120}"
      Converter__Url: "${CONVERTER_URL:-http://converter:8080}"
      Cors__AllowedOrigins: "${CORS_ALLOWED_ORIGINS:-https://localhost}"
    ports:
      - "5001:5000"
    volumes:
      - project_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      converter:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-https://localhost}"
    container_name: arch3dar-frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: arch3dar-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
    name: arch3dar_postgres_data
  project_data:
    name: arch3dar_project_data
